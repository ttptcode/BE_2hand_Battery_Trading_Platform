<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalR Chat Demo</title>
    <link rel="stylesheet" href="css/chat.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .demo-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .demo-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .demo-header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .demo-header p {
            color: #666;
            margin: 0;
        }
        
        .setup-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        
        .setup-section h3 {
            margin-top: 0;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }
        
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .btn:hover {
            background: #0056b3;
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .status-info {
            padding: 10px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            color: #155724;
            margin-bottom: 15px;
        }
        
        .error-info {
            padding: 10px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            color: #721c24;
            margin-bottom: 15px;
        }
        
        .chat-section {
            margin-top: 30px;
        }
        
        .chat-section h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        #chat-container {
            height: 500px;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-header">
            <h1>🚀 SignalR Chat Demo</h1>
            <p>Real-time chat functionality with SignalR integration</p>
        </div>

        <div class="setup-section">
            <h3>🔧 Setup Connection</h3>
            <div id="status-message"></div>
            
            <div class="form-group">
                <label for="jwt-token">JWT Token:</label>
                <input type="text" id="jwt-token" placeholder="Enter your JWT token">
            </div>
            
            <div class="form-group">
                <label for="user-id">User ID:</label>
                <input type="text" id="user-id" placeholder="Enter your User ID (GUID)">
            </div>
            
            <div class="form-group">
                <label for="conversation-id">Conversation ID:</label>
                <input type="text" id="conversation-id" placeholder="Enter Conversation ID (GUID)">
            </div>
            
            <button id="connect-btn" class="btn">Connect to Chat</button>
            <button id="disconnect-btn" class="btn" disabled>Disconnect</button>
        </div>

        <div class="chat-section">
            <h3>💬 Chat</h3>
            <div id="chat-container"></div>
        </div>
    </div>

    <!-- SignalR Scripts -->
    <script src="microsoft/signalr/dist/browser/signalr.min.js"></script>
    <script src="js/signalr-chat.js"></script>
    <script src="js/chat-ui.js"></script>
    
    <script>
        // Demo Application
        class ChatDemo {
            constructor() {
                this.chatUI = null;
                this.isConnected = false;
                this.initializeElements();
                this.setupEventListeners();
            }

            initializeElements() {
                this.jwtTokenInput = document.getElementById('jwt-token');
                this.userIdInput = document.getElementById('user-id');
                this.conversationIdInput = document.getElementById('conversation-id');
                this.connectBtn = document.getElementById('connect-btn');
                this.disconnectBtn = document.getElementById('disconnect-btn');
                this.statusMessage = document.getElementById('status-message');
                this.chatContainer = document.getElementById('chat-container');
            }

            setupEventListeners() {
                this.connectBtn.addEventListener('click', () => this.connect());
                this.disconnectBtn.addEventListener('click', () => this.disconnect());
                
                // Load saved values
                this.loadSavedValues();
            }

            loadSavedValues() {
                // Load from localStorage if available
                const savedToken = localStorage.getItem('demo_jwt_token');
                const savedUserId = localStorage.getItem('demo_user_id');
                const savedConversationId = localStorage.getItem('demo_conversation_id');
                
                if (savedToken) this.jwtTokenInput.value = savedToken;
                if (savedUserId) this.userIdInput.value = savedUserId;
                if (savedConversationId) this.conversationIdInput.value = savedConversationId;
            }

            saveValues() {
                localStorage.setItem('demo_jwt_token', this.jwtTokenInput.value);
                localStorage.setItem('demo_user_id', this.userIdInput.value);
                localStorage.setItem('demo_conversation_id', this.conversationIdInput.value);
            }

            async connect() {
                const token = this.jwtTokenInput.value.trim();
                const userId = this.userIdInput.value.trim();
                const conversationId = this.conversationIdInput.value.trim();

                if (!token || !userId) {
                    this.showError('Please enter JWT token and User ID');
                    return;
                }

                try {
                    this.showStatus('Connecting to chat server...', 'info');
                    
                    // Initialize Chat UI
                    this.chatUI = new ChatUI('chat-container');
                    await this.chatUI.initializeSignalR(token, userId);
                    
                    // Join conversation if provided
                    if (conversationId) {
                        await this.chatUI.joinConversation(conversationId);
                    }
                    
                    this.isConnected = true;
                    this.updateButtons();
                    this.showStatus('Connected successfully!', 'success');
                    this.saveValues();
                    
                } catch (error) {
                    console.error('Connection failed:', error);
                    this.showError('Failed to connect: ' + error.message);
                }
            }

            async disconnect() {
                try {
                    if (this.chatUI) {
                        await this.chatUI.disconnect();
                    }
                    
                    this.isConnected = false;
                    this.updateButtons();
                    this.showStatus('Disconnected from chat server', 'info');
                    
                } catch (error) {
                    console.error('Disconnect failed:', error);
                    this.showError('Failed to disconnect: ' + error.message);
                }
            }

            updateButtons() {
                this.connectBtn.disabled = this.isConnected;
                this.disconnectBtn.disabled = !this.isConnected;
            }

            showStatus(message, type = 'info') {
                this.statusMessage.innerHTML = `<div class="${type === 'error' ? 'error-info' : 'status-info'}">${message}</div>`;
            }

            showError(message) {
                this.showStatus(message, 'error');
            }
        }

        // Initialize demo when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ChatDemo();
        });
    </script>
</body>
</html>
